name: Dark Star Rail CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hardhat unit tests (TalentAgent + TalentAgentQuai)
        run: pnpm --filter contracts test

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: Compile artifacts and sync into the Foundry project
        run: |
          cd packages/contracts
          npx hardhat compile
          node scripts/sync-foundry-artifacts.js
      - name: Forge fuzz + invariant tests on the Vyper bytecode
        run: cd packages/contracts/foundry && forge test -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # slither 0.11.6 requires Python >= 3.10
      # NOTE: crytic/slither-action runs in a Docker image with an old Python
      # that cannot install slither >= 0.11.5 — run it directly instead.
      - name: Install slither + solc
        run: |
          pip install slither-analyzer==0.11.6 solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Slither static analysis (Solidity helper contracts)
        run: slither packages/contracts/contracts/TestSettlementToken.sol --fail-medium
      # NOTE: Slither cannot analyze Vyper. TalentAgentQuai.vy coverage is the
      # Hardhat unit suite + Foundry fuzz/invariant suites on its bytecode.

  facilitator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter facilitator test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/backend/requirements.txt
      - run: cd apps/backend && python -m pytest test_api.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No NEXT_PUBLIC_PRIVY_APP_ID here: the Privy SDK validates the ID at
      # init and a dummy value fails static prerender; Providers.tsx renders a
      # build-safe fallback when the var is unset.
      - run: pnpm --filter frontend build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build talent API image
        run: docker build -t btai-api-ci apps/backend
      - name: Build facilitator image (repo-root context)
        run: docker build -f packages/facilitator/Dockerfile -t btai-facilitator-ci .
      - name: Smoke - API image serves /health
        run: |
          docker run -d --name btai-api -e BTAI_ALLOWED_ORIGINS=https://darkcircle.si -p 8000:8000 btai-api-ci
          ok=0
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8000/health && ok=1 && break || sleep 2; done
          docker rm -f btai-api
          test "$ok" = 1
      - name: Smoke - facilitator image serves /health
        # Hardhat account #0 key — public, used only to let the adapter boot without a real chain
        run: |
          docker run -d --name btai-fac \
            -e FACILITATOR_ADAPTER=local \
            -e FACILITATOR_PRIVATE_KEY=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            -e ESCROW_ADDRESS=0x0000000000000000000000000000000000000001 \
            -p 3402:3402 btai-facilitator-ci
          ok=0
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3402/health && ok=1 && break || sleep 2; done
          docker rm -f btai-fac
          test "$ok" = 1
